# Configuration File
#
# Default environment variable values.
# These values can be overridden by .env file or environment variables.
# Environment variables take precedence over values in this file.
#
# Precedence order:
# 1. config.yaml (defaults, loaded first)
# 2. .env file / process.env (overrides, takes precedence)

env:
    # Client-side environment variables (NEXT_PUBLIC_*)
    # These are accessible on both client and server
    client:
        # NEXT_PUBLIC_API_URL: "https://api.example.com"
        # NEXT_PUBLIC_APP_NAME: "Gauss Electromagnetics"
        # Add your NEXT_PUBLIC_* variables here

    # Server-side environment variables
    # These are only accessible on the server
    server:
        # Resend Email Service Configuration
        RESEND_API_KEY: "" # Your Resend API key
        RESEND_FROM_ADDRESS: "onboarding@resend.dev" # Sender email address (must be verified in Resend)

        # Admin Email Configuration
        ADMIN_EMAIL: "" # Email address to receive contact form enquiries

        # Database Configuration (PostgreSQL)
        # For Docker: DB_HOST = "localhost" or container name (e.g., "postgres", "db")
        # For Neon Cloud: DB_HOST = "ep-xxx.region.aws.neon.tech"
        DB_USER: "postgres"
        DB_PASSWORD: "postgres"
        DB_HOST: "localhost"
        DB_PORT: "5432"
        DB_NAME: "gauss_db"
        DB_SSLMODE: "disable" # Use "disable" for local Docker, "require" for Neon/production
        DB_CHANNEL_BINDING: "disable" # Use "disable" for local Docker, "require" for Neon


        # Add more server-side environment variables here
        # DATABASE_URL: ""
        # API_SECRET_KEY: ""
