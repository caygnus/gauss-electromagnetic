<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                font-family: Arial, sans-serif;
                line-height: 1.6;
                color: #333;
            }

            .container {
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
            }

            .header {
                background-color: #1a1a1a;
                color: #fff;
                padding: 20px;
                border-radius: 5px 5px 0 0;
            }

            .content {
                background-color: #f9f9f9;
                padding: 20px;
                border-radius: 0 0 5px 5px;
            }

            .field {
                margin-bottom: 15px;
            }

            .label {
                font-weight: bold;
                color: #555;
                margin-bottom: 5px;
                display: block;
            }

            .value {
                color: #333;
            }

            .message-box {
                background-color: #fff;
                padding: 15px;
                border-left: 4px solid #1a1a1a;
                margin-top: 10px;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="header">
                <h2>New Contact Enquiry</h2>
            </div>
            <div class="content">
                <div class="field">
                    <span class="label">Name:</span>
                    <span class="value">{{name}}</span>
                </div>
                <div class="field">
                    <span class="label">Email:</span>
                    <span class="value">{{email}}</span>
                </div>
                <div class="field">
                    <span class="label">Phone:</span>
                    <span class="value">{{phone}}</span>
                </div>
                {{#company}}
                <div class="field">
                    <span class="label">Company:</span>
                    <span class="value">{{company}}</span>
                </div>
                {{/company}}
                <div class="field">
                    <span class="label">Product Interest:</span>
                    <span class="value">{{productInterestLabel}}</span>
                </div>
                {{#message}}
                <div class="field">
                    <span class="label">Message:</span>
                    <div class="message-box">{{{message}}}</div>
                </div>
                {{/message}}
            </div>
        </div>
    </body>
</html>
